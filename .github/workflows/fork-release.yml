# Fork-only GitHub Release for WAcry/codex.
# Tag: wa-v{upstream-version}.wa.{N}  e.g. wa-v0.152.0-alpha.6.wa.1
name: fork-release

on:
  push:
    tags:
      - "wa-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-check:
    if: github.repository == 'WAcry/codex'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Validate wa-v tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^wa-v(.+)$ ]]; then
            echo "Tag '${tag}' must start with wa-v" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Version '${version}' is not a Cargo semver string" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ \.wa\.[0-9]+$ ]]; then
            echo "Version '${version}' must end with .wa.N" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Using fork version ${version}"

  linux:
    needs: tag-check
    if: github.repository == 'WAcry/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-release-linux
      - name: Stamp workspace version
        working-directory: ${{ github.workspace }}
        env:
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
        run: python3 fork/scripts/stamp-workspace-version.py
      - name: cargo build
        run: cargo build --release --bin codex
      - name: Stage artifact
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="${CARGO_TARGET_DIR}/release/codex"
          test -f "${src}"
          strip --strip-unneeded "${src}" || true
          cp "${src}" dist/codex-x86_64-unknown-linux-gnu
          chmod 0755 dist/codex-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-gnu-x64
          path: dist/codex-x86_64-unknown-linux-gnu
          if-no-files-found: error

  windows:
    needs: tag-check
    if: github.repository == 'WAcry/codex'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-release-windows
      - name: Stamp workspace version
        working-directory: ${{ github.workspace }}
        env:
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
        run: python fork/scripts/stamp-workspace-version.py
      - name: cargo build
        shell: bash
        run: |
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --release --bin codex
      - name: Stage artifact
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="${CARGO_TARGET_DIR}/release/codex.exe"
          test -f "${src}"
          cp "${src}" dist/codex-x86_64-pc-windows-msvc.exe
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-msvc-x64
          path: dist/codex-x86_64-pc-windows-msvc.exe
          if-no-files-found: error

  release:
    needs:
      - tag-check
      - linux
      - windows
    if: >-
      ${{
        github.repository == 'WAcry/codex' &&
        always() &&
        needs.tag-check.result == 'success' &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum codex-x86_64-unknown-linux-gnu codex-x86_64-pc-windows-msvc.exe > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        id: notes
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "WAcry/codex ${VERSION}"
            echo
            echo "- commit: ${commit}"
            echo "- tag: ${GITHUB_REF_NAME}"
            echo "- Linux: x86_64-unknown-linux-gnu (unsigned)"
            echo "- Windows: x86_64-pc-windows-msvc (unsigned)"
          } > "${notes}"
          echo "path=${notes}" >> "${GITHUB_OUTPUT}"
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ needs.tag-check.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/**
          make_latest: true
          prerelease: ${{ contains(needs.tag-check.outputs.version, 'alpha') || contains(needs.tag-check.outputs.version, 'beta') }}
