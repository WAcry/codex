# Fork-only merge gate for WAcry/codex. Do not use as an upstream template.
# Required check name (ruleset): "Fork CI"
name: fork-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: github.repository == 'WAcry/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-ci-linux
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: cargo clippy
        run: cargo clippy --locked --bin codex
      - name: Check release-only code
        run: cargo check --locked --release --bin codex
      - name: Project tests
        run: |
          just test -p codex-core --lib
          just test -p codex-cli
          just test -p codex-tui

  windows:
    name: Windows
    if: github.repository == 'WAcry/codex'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-ci-windows
      - name: Check Windows release build
        shell: bash
        run: |
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo check --locked --release --bin codex

  required:
    name: Fork CI
    if: ${{ always() && github.repository == 'WAcry/codex' }}
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
