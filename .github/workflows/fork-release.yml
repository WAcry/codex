# Fork-only GitHub Release for WAcry/codex.
# Tag examples: wa-v0.152.0-wa.1, wa-v0.152.0-alpha.6.wa.1
name: fork-release

on:
  push:
    tags:
      - "wa-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-check:
    if: github.repository == 'WAcry/codex'
    runs-on: ubuntu-24.04
    outputs:
      make_latest: ${{ steps.parse.outputs.make_latest }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      upstream_commit: ${{ steps.parse.outputs.upstream_commit }}
      upstream_version: ${{ steps.parse.outputs.upstream_version }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse wa-v tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^wa-v(.+)$ ]]; then
            echo "Tag '${tag}' must start with wa-v" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          number='(0|[1-9][0-9]*)'
          core="${number}\\.${number}\\.${number}"

          if [[ "${version}" =~ ^${core}-wa\.[1-9][0-9]*$ ]]; then
            upstream_version="${version%-wa.*}"
            prerelease=false
            make_latest=true
          elif [[ "${version}" =~ ^${core}-(alpha(\.${number}){0,2}|beta(\.${number})?)\.wa\.[1-9][0-9]*$ ]]; then
            upstream_version="${version%.wa.*}"
            prerelease=true
            make_latest=false
          else
            echo "Version '${version}' must be UPSTREAM_VERSION.wa.N with N >= 1" >&2
            exit 1
          fi

          upstream_ref=refs/tags/upstream-release
          git fetch --no-tags https://github.com/openai/codex.git \
            "refs/tags/rust-v${upstream_version}:${upstream_ref}"
          upstream_commit="$(git rev-list -n 1 "${upstream_ref}")"

          echo "make_latest=${make_latest}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "upstream_commit=${upstream_commit}" >> "${GITHUB_OUTPUT}"
          echo "upstream_version=${upstream_version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Using fork version ${version} based on upstream ${upstream_version}"

  linux:
    needs: tag-check
    if: github.repository == 'WAcry/codex'
    # Build against glibc 2.35 so the GNU artifact also runs on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-release-linux
      - name: Install bwrap build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils libcap-dev pkg-config
      - name: Stamp workspace version
        env:
          BASE_VERSION: ${{ needs.tag-check.outputs.upstream_version }}
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
        run: python3 fork/scripts/stamp-workspace-version.py
      - name: Build bwrap and export digest
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          cargo build --manifest-path codex-rs/Cargo.toml --target "${target}" --release --bin bwrap
          bwrap="${CARGO_TARGET_DIR}/${target}/release/bwrap"
          strip --strip-debug --strip-unneeded "${bwrap}"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "${bwrap}" | awk '{print $1}')" >> "${GITHUB_ENV}"
      - name: Build canonical package
        env:
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          python3 scripts/build_codex_package.py \
            --target "${target}" \
            --package-version "${FORK_VERSION}" \
            --package-dir "dist/codex-package-${target}" \
            --archive-output "dist/codex-package-${target}.tar.gz" \
            --cargo-profile release \
            --bwrap-bin "${CARGO_TARGET_DIR}/${target}/release/bwrap"
          "dist/codex-package-${target}/bin/codex" --version
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-gnu-x64
          path: dist/codex-package-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  windows:
    needs: tag-check
    if: github.repository == 'WAcry/codex'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-release-windows
      - name: Stamp workspace version
        env:
          BASE_VERSION: ${{ needs.tag-check.outputs.upstream_version }}
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
        run: python fork/scripts/stamp-workspace-version.py
      - name: Build canonical package
        shell: bash
        env:
          FORK_VERSION: ${{ needs.tag-check.outputs.version }}
          LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
        run: |
          set -euo pipefail
          target=x86_64-pc-windows-msvc
          python scripts/build_codex_package.py \
            --target "${target}" \
            --package-version "${FORK_VERSION}" \
            --package-dir "dist/codex-package-${target}" \
            --archive-output "dist/codex-package-${target}.zip" \
            --cargo-profile release
          "dist/codex-package-${target}/bin/codex.exe" --version
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-msvc-x64
          path: dist/codex-package-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    needs:
      - tag-check
      - linux
      - windows
    if: >-
      ${{
        github.repository == 'WAcry/codex' &&
        always() &&
        needs.tag-check.result == 'success' &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success'
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            codex-package-x86_64-unknown-linux-gnu.tar.gz \
            codex-package-x86_64-pc-windows-msvc.zip \
            > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        id: notes
        env:
          UPSTREAM_COMMIT: ${{ needs.tag-check.outputs.upstream_commit }}
          UPSTREAM_VERSION: ${{ needs.tag-check.outputs.upstream_version }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "WAcry/codex ${VERSION}"
            echo
            echo "- commit: ${commit}"
            echo "- tag: ${GITHUB_REF_NAME}"
            echo "- upstream release: openai/codex rust-v${UPSTREAM_VERSION}"
            echo "- upstream release commit: openai/codex@${UPSTREAM_COMMIT}"
            echo "- Linux package: x86_64-unknown-linux-gnu, glibc 2.35 baseline (unsigned)"
            echo "- Windows package: x86_64-pc-windows-msvc (unsigned)"
          } > "${notes}"
          echo "path=${notes}" >> "${GITHUB_OUTPUT}"
      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ needs.tag-check.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/**
          make_latest: ${{ needs.tag-check.outputs.make_latest }}
          prerelease: ${{ needs.tag-check.outputs.prerelease }}
