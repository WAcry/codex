# Fork-only PR checks and post-merge tests for WAcry/codex.
# Required check name (ruleset): "Fork CI"
name: fork-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    if: github.repository == 'WAcry/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize workspace version for upstream tests
        working-directory: .
        env:
          TARGET_VERSION: 0.0.0
        run: |
          BASE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          export BASE_VERSION
          python3 fork/scripts/stamp-workspace-version.py
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        if: github.ref == 'refs/heads/main'
        with:
          tool: nextest@0.9.103
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-ci-linux
      - name: cargo fmt
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: cargo clippy
        run: cargo clippy --locked --bin codex
      - name: Check release-only code
        run: cargo check --locked --release --bin codex
      - name: Build Code Mode test host
        if: github.ref == 'refs/heads/main'
        run: cargo build --locked -p codex-code-mode-host --bin codex-code-mode-host
      - name: Fork test suite
        if: github.ref == 'refs/heads/main'
        run: |
          just test -p codex-core --lib
          just test -p codex-tools --lib
          just test -p codex-core --test all code_mode_can_apply_patch_via_nested_tool
          just test -p codex-core --test all code_mode_exposes_and_dispatches_namespaced_custom_tools
          just test -p codex-core --test all tool_search_returns_deferred_custom_tool_and_routes_follow_up_call
          just test -p codex-core --test all spawned_full_history_v2_child_uses_model_precedence_without_dropping_context
          just test -p codex-core --test all multi_agent_v2_spawn_sends_agent_message_to_child
          just test -p codex-history-notes-extension --test history_notes_extension installed_extension_exposes_and_invokes_history_notes_tools
          just test -p codex-cli --bin codex
          just test -p codex-tui

  windows:
    name: Windows
    if: github.repository == 'WAcry/codex'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize workspace version for upstream tests
        working-directory: .
        shell: pwsh
        env:
          TARGET_VERSION: 0.0.0
        run: |
          $env:BASE_VERSION = python -c 'import tomllib; print(tomllib.load(open("codex-rs/Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          python fork/scripts/stamp-workspace-version.py
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: codex-rs
          prefix-key: fork-ci-windows
      - name: Check Windows release build
        shell: bash
        run: |
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo check --locked --release --bin codex

  required:
    name: Fork CI
    if: ${{ always() && github.repository == 'WAcry/codex' }}
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
